name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- BUILD & PUSH SECTION ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # We use a clean, simple name here
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

      # --- DEPLOY SECTION ---
      - name: SSH into Azure VM and deploy container
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Pull the EXACT image name we just pushed
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
            
            # 2. Stop and remove the old container
            docker stop todo-app || true
            docker rm todo-app || true
            
            # 3. Clean up space (optional)
            docker image prune -f

            # 4. Run the new container
            # -p 3000:5173 = Map Azure Port 3000 to Container Port 5173
            # -e VITE_CONVEX_URL = Pass the database link securely
            docker run -d -p 3000:5173 -e VITE_CONVEX_URL=${{ secrets.VITE_CONVEX_URL }} --name todo-app ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest